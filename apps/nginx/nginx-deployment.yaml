apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: cnpbtlrdev/nginx-homelab:v1.0.3
        imagePullPolicy: Always
        ports:
        - containerPort: 80